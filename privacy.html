<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Политика конфиденциальности — annonce.</title>
<link rel="icon" href="/favicon.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#07222a;color:#eef1f0;font:16px/1.7 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:#e3a72f}a:hover{color:#f0c46a}
nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px clamp(20px,5vw,72px);border-bottom:1px solid rgba(238,241,240,.08)}
nav img{height:22px;display:block}
.lng{display:flex;border:1px solid rgba(238,241,240,.18);border-radius:8px;overflow:hidden}.lng button{background:transparent;border:0;color:rgba(238,241,240,.7);padding:6px 10px;cursor:pointer;font:inherit;font-size:12px}.lng button[aria-pressed=true]{background:rgba(227,167,47,.14);color:#e3a72f}
main{max-width:820px;margin:0 auto;padding:64px clamp(20px,5vw,40px) 96px}
h1{font-size:clamp(34px,5vw,56px);line-height:1.05;letter-spacing:-.03em;font-weight:500;margin:0 0 12px}
h2{font-size:22px;font-weight:500;letter-spacing:-.01em;margin:44px 0 10px}
p,li{color:rgba(238,241,240,.82)}ul{padding-left:20px}
.meta{color:rgba(238,241,240,.55);font-size:14px}
.box{margin-top:48px;padding:20px;border-radius:14px;background:#0b2e39;box-shadow:0 0 0 1px rgba(238,241,240,.08);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #e3a72f;color:#e3a72f;background:transparent;font:inherit;font-weight:500;cursor:pointer}
</style>
</head>
<body>
<nav><a href="/"><img src="/favicon.png" alt="annonce." style="height:28px;border-radius:6px"></a><div class="lng"><button data-l="ru">RU</button><button data-l="en">EN</button></div></nav>
<main><h1 id="t"></h1><div class="meta" id="m"></div><div id="b"></div>
<div class="box"><span id="ckt"></span><button class="btn" id="ck"></button></div>
<p style="margin-top:32px"><a href="/" id="back"></a></p></main>
<script>
(async () => {
  let L = new URLSearchParams(location.search).get('lang') || localStorage.getItem('annonce-lang') || ((navigator.language || 'ru').startsWith('ru') ? 'ru' : 'en');
  let d = {};
  try { d = await (await fetch('/content/legal.json', { cache: 'no-store' })).json(); } catch (e) {}
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
  const t = (v) => (v && typeof v === 'object' ? v[L] ?? v.ru : v) || '';
  const md = (src) => { const out = []; let list = null; const flush = () => { if (list) { out.push('<ul>' + list.join('') + '</ul>'); list = null; } };
    for (const raw of String(src).split('\n')) { const line = raw.trim(); if (!line) { flush(); continue; }
      const inl = esc(line).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[(.+?)\]\((https?:\/\/[^)\s]+|\/[^)\s]*|mailto:[^)\s]+)\)/g, '<a href="$2">$1</a>').replace(/([\w.+-]+@[\w-]+\.[\w.]+)/g, '<a href="mailto:$1">$1</a>');
      if (line.startsWith('## ')) { flush(); out.push('<h2>' + inl.slice(3) + '</h2>'); } else if (line.startsWith('- ')) { (list = list || []).push('<li>' + inl.slice(2) + '</li>'); } else { flush(); out.push('<p>' + inl + '</p>'); } }
    flush(); return out.join(''); };
  const render = () => {
    document.documentElement.lang = L;
    const c = d.company || {};
    const vars = { legalName: c.legalName, regNo: c.regNo, address: c.address, dpoEmail: c.dpoEmail || c.email, retention: t(d.retention), version: d.policyVersion, updated: d.policyUpdated };
    const body = t(d.policy).replace(/\{(\w+)\}/g, (m, k) => vars[k] ?? m);
    document.title = t(d.policyTitle) + ' — annonce.';
    document.getElementById('t').textContent = t(d.policyTitle) || 'Privacy Policy';
    document.getElementById('m').textContent = (L === 'ru' ? 'Версия ' : 'Version ') + (d.policyVersion || '') + ' · ' + (d.policyUpdated || '');
    document.getElementById('b').innerHTML = md(body);
    document.getElementById('ckt').textContent = L === 'ru' ? 'Изменить согласие на cookie' : 'Change your cookie consent';
    document.getElementById('ck').textContent = t(d.footerCookies) || 'Cookie settings';
    document.getElementById('back').textContent = L === 'ru' ? '← На главную' : '← Back to home';
    document.querySelectorAll('[data-l]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.l === L));
  };
  document.querySelectorAll('[data-l]').forEach((b) => b.addEventListener('click', () => { L = b.dataset.l; render(); }));
  document.getElementById('ck').addEventListener('click', () => { try { localStorage.removeItem('annonce-consent'); } catch (e) {} location.href = '/'; });
  render();
})();
</script>
</body>
</html>
